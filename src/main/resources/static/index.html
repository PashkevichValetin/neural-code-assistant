<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Code Assistant</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .chat-container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 80%;
            font-size: 1rem;
        }

        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .assistant-message {
            background-color: #f1f3f5;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 4px solid #3498db;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding: 8px 0;
            border-top: 1px solid #e9ecef;
            border-bottom: 1px solid #e9ecef;
        }

        .model-selector label {
            font-weight: 500;
            color: #2c3e50;
        }

        .model-selector select {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            background-color: white;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        .model-selector select:focus {
            border-color: #3498db;
        }

        .model-status {
            font-size: 0.8rem;
            color: #6c757d;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            padding-top: 10px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            resize: none;
            min-height: 48px;
            max-height: 30vh;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #3498db; }

        button {
            padding: 0 24px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            height: 48px;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 5px 10px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        @media (max-width: 600px) {
            .container {
                width: 100%;
                margin: 0;
                border-radius: 0;
                height: 100vh;
            }
            .message { max-width: 90%; }
            .model-selector { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Neural Code Assistant</h1>
    <div class="chat-container" id="chatContainer">
        <div class="message assistant-message">Привет! Теперь я занимаю всё доступное место. Чем могу помочь?</div>
    </div>
    <div class="typing-indicator" id="typingIndicator">Печатает...</div>

    <div class="model-selector">
        <label for="modelSelect">Модель:</label>
        <select id="modelSelect" disabled>
            <option value="">Загрузка моделей...</option>
        </select>
        <span class="model-status" id="modelStatus"></span>
    </div>

    <div class="input-container">
        <textarea id="questionInput" placeholder="Введите ваш вопрос..." rows="1"></textarea>
        <button id="sendButton">Отправить</button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chatContainer');
    const questionInput = document.getElementById('questionInput');
    const sendButton = document.getElementById('sendButton');
    const typingIndicator = document.getElementById('typingIndicator');
    const modelSelect = document.getElementById('modelSelect');
    const modelStatus = document.getElementById('modelStatus');

    let currentEventSource = null;

    // Авто-высота textarea
    questionInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    function addMessage(text, isUser = false, isError = false) {
        const messageDiv = document.createElement('div');
        let classes = `message ${isUser ? 'user-message' : 'assistant-message'}`;
        if (isError) classes += ' error-message';
        messageDiv.className = classes;
        messageDiv.textContent = text;
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return messageDiv;
    }

    // Загрузка списка моделей
    async function loadModels() {
        try {
            modelStatus.textContent = 'Загрузка...';
            const response = await fetch('/api/chat/models');
            if (!response.ok) throw new Error('Ошибка загрузки моделей');
            const models = await response.json();

            modelSelect.innerHTML = '';
            if (models.length === 0) {
                modelSelect.innerHTML = '<option value="">Модели не найдены</option>';
                modelStatus.textContent = 'Нет доступных моделей';
            } else {
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = model;
                    modelSelect.appendChild(option);
                });
                modelStatus.textContent = `${models.length} моделей`;
            }
            modelSelect.disabled = false;
        } catch (error) {
            console.error('Ошибка загрузки моделей:', error);
            modelSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
            modelStatus.textContent = 'Не удалось загрузить модели';
            modelSelect.disabled = true;
        }
    }

    // Отправка вопроса
    async function sendMessage() {
        const question = questionInput.value.trim();
        if (!question) return;

        // Закрываем предыдущий стрим, если есть
        if (currentEventSource) {
            currentEventSource.close();
            currentEventSource = null;
        }

        addMessage(question, true);
        questionInput.value = '';
        questionInput.style.height = 'auto';

        const selectedModel = modelSelect.value;
        typingIndicator.style.display = 'block';
        sendButton.disabled = true;

        const assistantMsgDiv = addMessage("", false);
        let fullContent = "";

        const url = `/api/chat/stream?question=${encodeURIComponent(question)}${selectedModel ? `&modelName=${encodeURIComponent(selectedModel)}` : ''}`;
        const eventSource = new EventSource(url);
        currentEventSource = eventSource;

        let errorOccurred = false;

        eventSource.onmessage = function(event) {
            typingIndicator.style.display = 'none';
            try {
                const data = JSON.parse(event.data);
                if (data.content) {
                    fullContent += data.content;
                    assistantMsgDiv.textContent = fullContent;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (e) {
                console.error('Ошибка парсинга:', e);
            }
        };

        eventSource.onerror = function() {
            typingIndicator.style.display = 'none';
            sendButton.disabled = false;

            if (!errorOccurred) {
                errorOccurred = true;
                if (fullContent === "") {
                    assistantMsgDiv.textContent = "Ошибка при получении ответа от сервера. Попробуйте позже.";
                    assistantMsgDiv.classList.add('error-message');
                } else {
                    // Если уже есть контент, просто завершаем
                }
            }
            eventSource.close();
            if (currentEventSource === eventSource) currentEventSource = null;
        };

        // Обработка неожиданного закрытия (например, завершение стрима)
        eventSource.addEventListener('close', () => {
            sendButton.disabled = false;
            if (currentEventSource === eventSource) currentEventSource = null;
        });
    }

    sendButton.addEventListener('click', sendMessage);
    questionInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Загружаем модели при старте
    loadModels();
</script>
</body>
</html>
