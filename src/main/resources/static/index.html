<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Code Assistant</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
            color: #333;
            height: 100vh; /* На всю высоту экрана */
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 95%;
            max-width: 1400px; /* Максимальная ширина для очень больших мониторов */
            margin: 20px auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            flex: 1; /* Растягивается, чтобы занять всё доступное место */
            display: flex;
            flex-direction: column;
            min-height: 0; /* Важно для корректного скролла внутри flex */
        }

        h1 { color: #2c3e50; text-align: center; margin-top: 0; font-size: 1.5rem; }

        .chat-container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            flex: 1; /* Занимает всё свободное место в контейнере */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 80%;
            font-size: 1rem;
        }

        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .assistant-message {
            background-color: #f1f3f5;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border-left: 4px solid #3498db;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            padding-top: 10px;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            resize: none;
            min-height: 48px;
            max-height: 30vh; /* Высота поля ввода не более 30% высоты экрана */
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: #3498db; }

        button {
            padding: 0 24px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            height: 48px;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }

        .typing-indicator { display: none; padding: 5px 10px; font-size: 0.9rem; color: #7f8c8d; }

        /* Адаптивность для мобилок */
        @media (max-width: 600px) {
            .container { width: 100%; margin: 0; border-radius: 0; height: 100vh; }
            .message { max-width: 90%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Neural Code Assistant</h1>
    <div class="chat-container" id="chatContainer">
        <div class="message assistant-message">Привет! Теперь я занимаю всё доступное место. Чем могу помочь?</div>
    </div>
    <div class="typing-indicator" id="typingIndicator">Печатает...</div>
    <div class="input-container">
        <textarea id="questionInput" placeholder="Введите ваш вопрос..." rows="1"></textarea>
        <button id="sendButton">Отправить</button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chatContainer');
    const questionInput = document.getElementById('questionInput');
    const sendButton = document.getElementById('sendButton');
    const typingIndicator = document.getElementById('typingIndicator');

    // Авто-высота textarea
    questionInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    function addMessage(text, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
        messageDiv.textContent = text;
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return messageDiv;
    }

    async function sendMessage() {
        const question = questionInput.value.trim();
        if (!question) return;

        addMessage(question, true);
        questionInput.value = '';
        questionInput.style.height = 'auto';

        typingIndicator.style.display = 'block';

        const assistantMsgDiv = addMessage("", false);
        let fullContent = "";

        const eventSource = new EventSource(`/api/chat/stream?question=${encodeURIComponent(question)}`);

        eventSource.onmessage = function(event) {
            typingIndicator.style.display = 'none';
            try {
                const data = JSON.parse(event.data);
                if (data.content) {
                    fullContent += data.content;
                    assistantMsgDiv.textContent = fullContent;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (e) { console.error(e); }
        };

        eventSource.onerror = function() {
            typingIndicator.style.display = 'none';
            eventSource.close();
        };
    }

    sendButton.addEventListener('click', sendMessage);
    questionInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
