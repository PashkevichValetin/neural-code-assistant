services:
  postgres:
    image: ankane/pgvector:latest
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rag_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=valentin
    volumes:
      - ./infra/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valentin -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
networks:
  default:
    name: rag-network
